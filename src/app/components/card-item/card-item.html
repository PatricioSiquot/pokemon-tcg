<article class="rounded-lg bg-white p-2 shadow transition hover:shadow-lg">
  @if (imageUrl(); as url) {
    <img
      [src]="url"
      [alt]="card().name"
      width="245"
      height="337"
      loading="lazy"
      class="h-auto w-full rounded"
    />
  } @else {
    <div class="flex aspect-[245/337] items-center justify-center rounded bg-gray-100 text-sm text-gray-500">
      Sin imagen
    </div>
  }
  <h3 class="mt-2 truncate text-center text-sm font-medium">{{ card().name }}</h3>
</article>

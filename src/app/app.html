<main class="mx-auto max-w-6xl p-4">
  @let s = state();

  @if (s.status === 'loading') {
    <p role="status" class="py-12 text-center text-gray-500">Loading cards…</p>
  } @else if (s.status === 'error') {
    <p role="alert" class="py-12 text-center text-red-600">
      Something went wrong while loading the cards. Please try again later.
    </p>
  } @else if (s.cards.length === 0) {
    <p class="py-12 text-center text-gray-500">No cards found.</p>
  } @else {
    <app-card-grid [cards]="s.cards" />
  }
</main>

<router-outlet />
